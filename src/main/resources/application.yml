spring:
  application:
    name: caffeine-rhythm
  jpa:
    open-in-view: false
    hibernate:
      # 설계가 자주 바뀌는 P0 개발 중에는 매 실행마다 새로 만든다.
      # 배포 시점에 Flyway + validate 로 전환한다.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: debug
