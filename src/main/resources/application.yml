spring:
  application:
    name: caffeine-rhythm
  datasource:
    # 로컬 compose.yaml 의 Postgres. 운영에서는 SPRING_DATASOURCE_* 환경 변수가 덮어쓴다.
    url: jdbc:postgresql://localhost:5432/caffeine_rhythm
    username: caffeine
    password: caffeine
  jpa:
    open-in-view: false
    hibernate:
      # 설계가 자주 바뀌는 P0 개발 중에는 매 실행마다 새로 만든다.
      # 배포 시점에 Flyway + validate 로 전환한다.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: debug
